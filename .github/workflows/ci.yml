name: Reference build checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Verify quarterly and half-year feedback in Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            export CHROMIUM="$(command -v google-chrome)"
          else
            python -m playwright install --with-deps chromium
          fi
          python test/browser/feedback.py
